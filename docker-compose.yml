services:
  mariadb:
    image: mariadb:11.4
    environment:
      MARIADB_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-root_mcp_2026}"
      MARIADB_DATABASE: "${DB_NAME:-mcp_db}"
      MARIADB_USER: "${DB_USER:-mcp_user}"
      MARIADB_PASSWORD: "${DB_PASSWORD:-mcp_secure_2026}"
      MARIADB_COLLATE: utf8mb4_unicode_ci
      MARIADB_CHARSET: utf8mb4
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: >
      --default-storage-engine=InnoDB
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --max_connections=1000

  backend:
    build:
      context: .
    user: root
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      DJANGO_DEBUG: "1"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1"
      CORS_ALLOWED_ORIGINS: "http://localhost:${FRONTEND_PORT:-5173}"
      # In development allow open API to avoid sending headers from local frontend
      API_KEY: ""
      ALLOW_OPEN_API_FOR_DEV: "1"
      STUB_PROVIDERS: "${STUB_PROVIDERS:-0}"

      LOG_LEVEL: "INFO"
      # Modelos LLM / OCR / Assistant (variables de entorno)
      OLLAMA_MODEL: "${OLLAMA_MODEL:-qwen2.5:7b}"
      OLLAMA_VISION_MODEL: "${OLLAMA_VISION_MODEL:-gemma4:e2b}"
      LLM_MODEL: "${LLM_MODEL:-qwen2.5:7b}"
      OCR_MODE: "${OCR_MODE:-auto}"
      OCR_MODEL: "${OCR_MODEL:-spa}"
      OCR_PROVIDER: "${OCR_PROVIDER:-ollama}"
      ASSISTANT_MODEL: "${ASSISTANT_MODEL:-qwen2.5:7b}"
      ASSISTANT_TEMPERATURE: "${ASSISTANT_TEMPERATURE:-0.2}"
      ASSISTANT_NUM_PREDICT: "${ASSISTANT_NUM_PREDICT:-256}"
      OCR_TEMPERATURE: "${OCR_TEMPERATURE:-0.2}"
      OCR_NUM_PREDICT: "${OCR_NUM_PREDICT:-128}"
      OLLAMA_TIMEOUT: "${OLLAMA_TIMEOUT:-180}"
      DATABASE_URL: "mysql://${DB_USER:-mcp_user}:${DB_PASSWORD:-mcp_secure_2026}@mariadb:3306/${DB_NAME:-mcp_db}"
      DB_HOST: "mariadb"
      DB_PORT: "3306"
      DB_NAME: "${DB_NAME:-mcp_db}"
      DB_USER: "${DB_USER:-mcp_user}"
      DB_PASSWORD: "${DB_PASSWORD:-mcp_secure_2026}"

      # Modo A: Ollama local en tu host.
      #   OLLAMA_BASE_URL=http://host.docker.internal:11434
      #
      # Modo B: Ollama dentro del compose.
      #   OLLAMA_BASE_URL=http://ollama:11434
      # Use host.docker.internal so backend running in Docker can reach Ollama on the host
      OLLAMA_BASE_URL: "http://host.docker.internal:11434"
      OLLAMA_URL: "http://host.docker.internal:11434/api/generate"
      OLLAMA_TAGS_URL: "http://host.docker.internal:11434/api/tags"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mariadb:
        condition: service_healthy
    volumes:
      - .:/app
      - backend_media:/app/media

  frontend:
    build:
      context: ../Frontend-diplo
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: "http://localhost:${BACKEND_PORT:-8000}/api"
        VITE_API_KEY: "${VITE_API_KEY:-dev}"
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      - backend

  ollama:
    image: ollama/ollama:latest
    profiles:
      - ollama
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  backend_media:
  mariadb_data:
  ollama_data:
