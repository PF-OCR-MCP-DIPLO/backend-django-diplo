services:
  backend:
    build:
      context: .
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      DJANGO_DEBUG: "1"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1"
      CORS_ALLOWED_ORIGINS: "http://localhost:${FRONTEND_PORT:-5173}"
      API_KEY: "dev"
      STUB_PROVIDERS: "1"
      LOG_LEVEL: "INFO"
    volumes:
      - backend_media:/app/media

  frontend:
    build:
      context: ../Frontend-diplo
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: "http://localhost:${BACKEND_PORT:-8000}/api"
        VITE_API_KEY: "dev"
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      - backend

volumes:
  backend_media:
