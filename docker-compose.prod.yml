services:
  mariadb:
    image: mariadb:11.4
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      MARIADB_COLLATE: utf8mb4_unicode_ci
      MARIADB_CHARSET: utf8mb4
    command: >
      --default-storage-engine=InnoDB
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --max_connections=1000
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - app_net

  backend:
    build:
      context: .
    restart: unless-stopped
    env_file:
      - .env.production
    expose:
      - "8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mariadb:
        condition: service_healthy
    volumes:
      - backend_media:/app/media
      - backend_static:/app/staticfiles
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health/').status == 200 else 1)",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - app_net

  frontend:
    build:
      context: ../Frontend-diplo
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - backend_media:/srv/media:ro
      - backend_static:/srv/static:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - app_net

volumes:
  mariadb_data:
  backend_media:
  backend_static:

networks:
  app_net:
    driver: bridge
